name: Build and Release Chess Tournament Manager

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install desktop build dependencies
        shell: pwsh
        run: npm install

      - name: Build standalone Windows EXE
        shell: pwsh
        run: npm run dist

      - name: Verify EXE exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist/Chess-Tournament-Manager.exe")) { throw "EXE not found" }
          Get-Item "dist/Chess-Tournament-Manager.exe" | Format-List Name,Length,LastWriteTime

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chess-Tournament-Manager-Windows
          path: dist/Chess-Tournament-Manager.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Chess-Tournament-Manager.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
